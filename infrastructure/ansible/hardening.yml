- hosts: oci_instance
  become: true
  collections:
    - devsec.hardening
  vars:
    # Nasłuchuj SSH tylko na interfejsie VPN Tailscale
    ssh_listen_to: ["{{ inventory_hostname }}"]
  roles:
    - os_hardening
    - ssh_hardening
  tasks:
    - name: Zainstaluj fail2ban i unattended-upgrades
      apt:
        name: [fail2ban, unattended-upgrades, ufw]
        state: present
        update_cache: true

    - name: ufw — domyślnie odrzucaj ruch przychodzący
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: ufw — SSH tylko z interfejsu tailscale0
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        port: '22'

    - name: ufw — strona publiczna (80/443)
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop: ['80', '443']
